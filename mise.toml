[tools]
go = "latest"
goreleaser = "latest"

# Tasks intentionally avoid POSIX-only syntax: mise runs them through cmd.exe
# on Windows and through sh elsewhere. Host builds go through goreleaser so
# CGO_ENABLED=0, -trimpath, and -X main.version stay in .goreleaser.yaml.
# A plain `go build` / `go run` still keeps the "dev" default.

[tasks.build]
description = "Static ./pear(.exe) with the release ldflags and a git describe version"
run = "go run ./tools/dev build"

[tasks.fmt]
description = "Rewrite Go sources with gofmt"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Fail when gofmt would change a file"
run = "go run ./tools/dev fmtcheck"

[tasks.check]
description = "Vet and compile every package"
run = [
  "go vet ./...",
  "go build ./...",
]

[tasks.snapshot]
description = "Cross-build release archives into dist/ without publishing (version stamped)"
run = "goreleaser release --snapshot --clean"

[tasks."release:check"]
description = "Validate .goreleaser.yaml without building"
run = "goreleaser check"
