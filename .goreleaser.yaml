version: 2

project_name: pear

before:
  hooks:
    - go mod tidy

builds:
  - id: pear
    main: ./cmd/pear
    binary: pear
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Single source of truth for the stamp. `mise run build` passes
      # PEAR_VERSION (git describe, leading v stripped) through the snapshot
      # template below; a real release leaves it unset and uses the tag.
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  # Empty PEAR_VERSION keeps GoReleaser's usual snapshot name for CI.
  version_template: '{{ if .Env.PEAR_VERSION }}{{ .Env.PEAR_VERSION }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

archives:
  - id: pear
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: linux
        formats: [tar.gz]
    # The READMEs embed assets/readme/*.svg, so ship them alongside or the
    # image is broken for anyone who opens the archive instead of the repo.
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - README.zh-TW.md
      - assets/readme/*.svg

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  footer: |
    **Verify the download**

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    Then read the README install section for your platform.
